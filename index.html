(function(){

  var q = (new URLSearchParams(location.search)).get("lang");

 }

  document.querySelectorAll("[data-link]").forEach(function(a){
   var k = a.getAttribute("data-link"), url = LINKS[k];
   var t = a.querySelector(".btxt");
   if(url){ a.href = url; a.removeAttribute("aria-disabled"); a.classList.add("on"); t.setAttribute("data-i", k==="play" ? "get" : "join_btn"); a.target="_blank"; a.rel="noopener"; }

  });
 }
